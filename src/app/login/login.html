<div class="login-container">

    <h2>Resident Login</h2>

    <form (ngSubmit)="login()">

        <input type="email"
        [(ngModel)]="email"
         name="email"
         placeholder="Email"
         required>

         <input type="password"
         [(ngModel)]="password"
         name="password"
         placeholder="Password"
         required>

         <button type="submit">
            Login
         </button>
    </form>
    <p *ngIf="message"> 
        {{ message }}
    </p>

    <p>
        Don't have an account?
        <a routerLink="/register"> Register</a>
    </p>
</div>
