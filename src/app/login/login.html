<div class="login-page">


<div class="login-container">

    <div class="login-card">

        <div class="login-header">

            <a routerLink="/" class="login-logo">
                <img
                    src="images/mankilamease.png"
                    alt="MankilamEase Logo">
            </a>

            <h1>
              Login
            </h1>

            <p>
                Sign in to your MankilamEase account
            </p>

        </div>

        <form (ngSubmit)="login()">

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    [(ngModel)]="email"
                    name="email"
                    placeholder="Enter your email"
                    required>

            </div>

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    [(ngModel)]="password"
                    name="password"
                    placeholder="Enter your password"
                    required>

            </div>

            <button type="submit" class="login-submit">
                Login
            </button>

        </form>

        @if (message) {
            <p class="login-message">
                {{ message }}
            </p>
        }

        <p class="register-text">
            Don't have an account?

            <a routerLink="/register">
                Create an account
            </a>
        </p>

        <a routerLink="/" class="back-home">
            <i class="bi bi-arrow-left"></i>
            Back to Home
        </a>

    </div>

</div>


</div>
