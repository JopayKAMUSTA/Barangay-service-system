<div class="admin-dashboard">

    <div class="page-header">
        <div>
            <h1>Dashboard</h1>
            <p>Welcome to the MankilamEase</p>
        </div>
    </div>

    <div class="stats">

        <div class="stat-card">

            <h3>Total Requests</h3>

            <p>
                {{ totalRequests$ | async }}
            </p>
        </div>

        <div class="stat-card">

            <h3>Pending</h3>

            <p>
                {{ pendingRequests$ | async }}
            </p>

        </div>

        <div class="stat-card">

            <h3> Approved</h3>

            <p>
                {{ approvedRequests$ | async}}
            </p>
        </div>

        <div class="stat-card">

            <h3>Rejected</h3>
            
            <p>
                {{ rejectedRequests$ | async }}
            </p>
        </div>
    </div>

    <div class="quick-actions">

        <h2>Quick Actions</h2>

        <div class="action-grid">

            <button routerLink="/admin-request">
                Document Requests
            </button>

            <button routerLink="/admin-resident">
                Manage Residents
            </button>

            <button routerLink="/admin-announcement">
                Create Announcement
            </button>
        </div>
    </div>
</div>
