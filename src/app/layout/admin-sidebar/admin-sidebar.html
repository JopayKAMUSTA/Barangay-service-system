<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


<aside class="admin-sidebar">

    <div class="sidebar-header">

        <div class="barangay-logo">
            <img
                src="images/mankilamease.png"
                alt="MankilamEase Logo"
            >
        </div>

        <div class="sidebar-brand">
            <h2>MankilamEase</h2>
            <span>Admin Panel</span>
        </div>

    </div>


    <nav class="sidebar-menu">

        <a
            routerLink="/admin-dashboard"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }">

            <i class="bi bi-grid-1x2-fill"></i>
            <span>Dashboard</span>

        </a>


        <a
            routerLink="/admin-document-type"
            routerLinkActive="active">

            <i class="bi bi-file-earmark-text"></i>
            <span>Document Type</span>

        </a>


        <a
            routerLink="/admin-request"
            routerLinkActive="active">

            <i class="bi bi-file-earmark-check"></i>
            <span>Document Request</span>

        </a>


        <a
            routerLink="/admin-earning"
            routerLinkActive="active">

            <i class="bi bi-cash-stack"></i>
            <span>Earnings</span>

        </a>


        <a
            routerLink="/admin-announcement"
            routerLinkActive="active">

            <i class="bi bi-megaphone"></i>
            <span>Announcements</span>

        </a>


        <a
            routerLink="/admin-reports"
            routerLinkActive="active">

            <i class="bi bi-bar-chart"></i>
            <span>Reports</span>

        </a>


        <a
            routerLink="/admin-resident"
            routerLinkActive="active">

            <i class="bi bi-people"></i>
            <span>Residents</span>

        </a>

    </nav>


    <div class="sidebar-footer">

        <button
            type="button"
            (click)="logout()">

            <i class="bi bi-box-arrow-right"></i>
            <span>Logout</span>

        </button>

    </div>

</aside>
