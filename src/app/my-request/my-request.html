<div class="my-request-page">

    <div class="page-header">

        <h1>My Requests</h1>

        <p>
            View and track your document request.
        </p>

    </div>


    <div class="requests-card">

        <div *ngIf="requests$ | async as requests">

            <div class="empty-message"
            *ngIf="requests.length === 0">
            
            <p>
                You haven't submitted any document requests yet
            </p>

            <a routerLink="/document-request">
                Request a Document
            </a>

            </div>

            <div class="table-wrapper"
            *ngIf="requests.length > 0">
            
            <table>

                <thead>

                    <tr>
                        <th>Document</th>
                        <th>Purpose</th>
                        <th>Status</th>
                        <th>Date Requested</th>

                    </tr>
                </thead>

                <tbody>

                    <tr *ngFor="let request of requests">

                        <td>
                            <strong>
                                {{ request.documentType }}
                            </strong>
                        </td>

                        <td>
                            {{ request.purpose }}
                        </td>

                        <td>
                            <span class="status" [ngClass]="request.status">

                                {{ request.status}}
                            </span>
                        </td>

                        <td>
                            {{ request.createdAt?.toDate() | date:'medium' }}
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        </div>
    </div>
</div>
