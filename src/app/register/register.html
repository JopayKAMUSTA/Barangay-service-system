<div class="register-page">


<div class="register-container">

    <div class="register-card">

        <div class="register-header">

            <a routerLink="/" class="register-logo">
                <img
                    src="images/mankilamease.png"
                    alt="MankilamEase Logo">
            </a>

            <h1>
                Create Your Account
            </h1>

            <p>
                Register as a resident of Barangay Mankilam
            </p>

        </div>

        <form (ngSubmit)="register()">

            <div class="form-grid">

                <div class="form-group">

                    <label for="firstname">
                        First Name
                    </label>

                    <input
                        type="text"
                        id="firstname"
                        [(ngModel)]="firstname"
                        name="firstname"
                        placeholder="Enter first name"
                        required>

                </div>

                <div class="form-group">

                    <label for="middlename">
                        Middle Name
                    </label>

                    <input
                        type="text"
                        id="middlename"
                        [(ngModel)]="middlename"
                        name="middlename"
                        placeholder="Enter middle name"
                        required>

                </div>

                <div class="form-group">

                    <label for="lastname">
                        Last Name
                    </label>

                    <input
                        type="text"
                        id="lastname"
                        [(ngModel)]="lastname"
                        name="lastname"
                        placeholder="Enter last name"
                        required>

                </div>

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        [(ngModel)]="email"
                        name="email"
                        placeholder="Enter email"
                        required>

                </div>

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        [(ngModel)]="password"
                        name="password"
                        placeholder="Enter password"
                        required>

                </div>

                <div class="form-group">

                    <label for="contactNumber">
                        Contact Number
                    </label>

                    <input
                        type="text"
                        id="contactNumber"
                        [(ngModel)]="contactNumber"
                        name="contactNumber"
                        placeholder="Enter contact number"
                        required>

                </div>

                <div class="form-group">

                    <label for="birthdate">
                        Birthdate
                    </label>

                    <input
                        type="date"
                        id="birthdate"
                        [(ngModel)]="birthdate"
                        name="birthdate"
                        required>

                </div>

                <div class="form-group">

                    <label for="address">
                        Address
                    </label>

                    <input
                        type="text"
                        id="address"
                        [(ngModel)]="address"
                        name="address"
                        placeholder="Enter address"
                        required>

                </div>

            </div>

            <button
                type="submit"
                class="register-submit">

                Create Account

            </button>

        </form>

        @if (message) {
            <p class="register-message">
                {{ message }}
            </p>
        }

        <p class="login-text">

            Already have an account?

            <a routerLink="/login">
                Login
            </a>

        </p>

        <a routerLink="/" class="back-home">
            <i class="bi bi-arrow-left"></i>
            Back to Home
        </a>

    </div>

</div>


</div>
