<div class="request-page">

    <!-- ========================================== -->
    <!-- PAGE HEADER -->
    <!-- ========================================== -->

    <div class="page-header">

        <h1>
            Request a Document
        </h1>

        <p>
            Submit a request for a barangay document online.
        </p>

    </div>


    <!-- ========================================== -->
    <!-- REQUEST CARD -->
    <!-- ========================================== -->

    <div class="request-card">

        <form
            (ngSubmit)="submitRequest()"
        >


            <!-- ========================================== -->
            <!-- DOCUMENT TYPE -->
            <!-- ========================================== -->

            <div class="form-group">

                <label for="documentType">
                    Document Type
                </label>


                <select
                    id="documentType"
                    [(ngModel)]="documentType"
                    name="documentType"
                    required
                >

                    <option value="">
                        Select a Document
                    </option>


                    <option
                        *ngFor="let document of documentTypes"
                        [value]="document.id"
                        [disabled]="document.status !== 'Active'"
                    >

                        {{ document.name }}

                        -

                        P{{ document.fee | number:'1.2-2' }}

                        <span
                            *ngIf="document.status !== 'Active'"
                        >
                            (Unavailable)
                        </span>

                    </option>

                </select>

            </div>


            <!-- ========================================== -->
            <!-- PURPOSE -->
            <!-- ========================================== -->

            <div class="form-group">

                <label for="purpose">
                    Purpose
                </label>


                <textarea
                    id="purpose"
                    name="purpose"
                    [(ngModel)]="purpose"
                    placeholder="Enter the purpose of your request"
                    required
                ></textarea>

            </div>


            <!-- ========================================== -->
            <!-- SUBMIT -->
            <!-- ========================================== -->

            <button
                type="submit"
                class="submit-button"
            >

                Submit Request

            </button>


            <!-- ========================================== -->
            <!-- STATUS MESSAGE -->
            <!-- ========================================== -->

            <p
                class="status-message"
                *ngIf="statusMessage"
            >

                {{ statusMessage }}

            </p>

        </form>

    </div>

</div>
