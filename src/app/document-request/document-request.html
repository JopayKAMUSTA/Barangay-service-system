<div class="request-page">

    <div class="page-header">

        <h1>Request a Document</h1>

        <p>
            Submit a request for a barangay document online.
        </p>
    </div>

    <div class="request-card">

        <form (ngSubmit)="submitRequest()">

            <div class="form-group">

                <label for="documentType">
                    Document Type
                </label>

                <select id="documentType"
                [(ngModel)]="documentType"
                name="documentType"
                required>
            
                    <option value="">
                        Select a Document
                    </option>

                    <option [value]="document.id" *ngFor="let document of documentTypes$ | async"
                    [disabled]="document.status !== 'Active' ">
                        {{ document.name }} -
                        P{{ document.fee | number:'1.2-2' }}
                    </option>

                </select>
            </div>

            <div class="form-group">

                <label for="purpose">
                    Purpose
                </label>

                <textarea name="purpose" id="purpose"
                [(ngModel)]="purpose"
                placeholder="Enter the purpose of your request" required>
                </textarea>
            </div>

            <button
            type="submit"
            class="submit-button">
            
                Submit Request

            </button>

            <p class="status-message" *ngIf="statusMessage">
                {{ statusMessage }}
            </p>
        </form>
    </div>
</div>
